<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Event Ticket</h1>
    
        <form id="ticketForm" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
            </div>
    
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
    
            <div class="form-row">
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" name="type" required>
                        <option value="" disabled selected>Choose one</option>
                        <option value="student">Student</option>
                        <option value="guest">Guest</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="eventDate">Event Date</label>
                    <input type="date" id="eventDate" name="eventDate" required>
                </div>
            </div>
    
            <!-- Hidden Dynamic Field Container -->
            <div id="dynamicFieldContainer" class="form-group hidden">
                <label id="dynamicLabel" for="dynamicInput"></label>
                <input type="text" id="dynamicInput" name="dynamicInput">
            </div>
    
            <button type="submit" id="submitBtn">Create Ticket</button>
        </form>
    
        <!-- Error Container Placed Below the Form -->
        <div id="errorContainer" class="error-container hidden"></div>
    
        <!-- Success Ticket Information Section -->
        <div id="ticketOutput" class="ticket-output hidden"></div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
