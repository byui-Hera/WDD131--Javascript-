<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Snortleblat Character Card">
    <meta property="og:description" content="A character card for the mighty Snortleblat guardian.">
    <meta property="og:site_name" content="Snortleblat Character Card">
    <meta property="og:url" content="https://byui-hera.github.io/WDD131--Javascript-/Weeks/charactercard/">
    <meta property="og:image" content="https://byui-hera.github.io/WDD131--Javascript-/Weeks/charactercard/snortleblat.webp">
    <meta property="og:image:alt" content="Snortleblat character portrait">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Snortleblat Character Card">
    <meta name="twitter:description" content="A character card for the mighty Snortleblat guardian.">
    <meta name="twitter:image" content="https://byui-hera.github.io/WDD131--Javascript-/Weeks/charactercard/snortleblat.webp">

    <title>Character Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <img class="image" src="snortleblat.webp" alt="Snortleblat character portrait">
        <h1 class="name">Snortleblat</h1>

        <div class="stats">
            <p>Class: Guardian</p>
            <p>Level: 10</p>
            <p>Health: 100</p>
        </div>

        <p id="status" class="status">Snortleblat is ready for battle!</p>

        <div class="buttons">
            <button id="attack" type="button">Attack</button>
            <button id="level-up" type="button">Level Up</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
